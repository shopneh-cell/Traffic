<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><title>ترافیک</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
<style id="ps"></style>
<style>
:root{--bg:#f2f5fa;--c:#fff;--t:#16213a;--m:#6b7690;--p:#0b3d9e;--bt:#fff;--ok:#12805c;--w:#d97706;--e:#c62828;--l:#e3e8f2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1424;--c:#18203a;--t:#e8edf8;--m:#9aa6c4;--p:#6d9bff;--bt:#0e1424;--ok:#38c79a;--w:#f5a524;--e:#ff6b6b;--l:#28324f}}
:root[data-theme=dark]{--bg:#0e1424;--c:#18203a;--t:#e8edf8;--m:#9aa6c4;--p:#6d9bff;--bt:#0e1424;--ok:#38c79a;--w:#f5a524;--e:#ff6b6b;--l:#28324f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font:15px Vazirmatn,Tahoma,sans-serif;padding-bottom:30px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--c);padding:8px 12px;box-shadow:0 1px 4px #0002}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.logo{background:#fff;border-radius:10px;padding:2px 8px;height:38px}
#bell{font-size:22px;position:relative}#bell i{position:absolute;top:-6px;left:-8px;background:var(--e);color:#fff;border-radius:9px;font:700 11px sans-serif;padding:1px 5px}
.card{background:var(--c);border-radius:14px;padding:12px;margin:10px 12px;box-shadow:0 1px 3px #0001}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 12px}.g .card{margin:0}
.tile{text-align:center;font-size:17px;padding:18px 6px}
.btn{border:0;border-radius:12px;padding:12px;background:var(--p);color:var(--bt);font:700 15px inherit;font-family:inherit;width:100%}
.big{padding:16px;font-size:18px}.add{width:calc(100% - 24px);margin:10px 12px}
input,select{width:100%;padding:11px;border:1px solid var(--l);border-radius:10px;background:var(--c);color:var(--t);font:inherit;margin:4px 0}
header input{width:auto;flex:1}header button{border:0;background:var(--l);color:var(--t);border-radius:10px;padding:10px 12px;font-size:16px}
.sgs{display:flex;gap:6px;margin:10px 12px}.sgs button{flex:1;border:1px solid var(--l);background:var(--c);color:var(--t);border-radius:10px;padding:10px;font:inherit}.sgs .on{background:var(--p);color:var(--bt);border-color:var(--p)}
.q{border:0;background:var(--l);color:var(--t);border-radius:8px;width:30px;height:30px;font-size:18px}
small,.m{color:var(--m)}#sr{max-height:50vh;overflow:auto}table{width:100%;border-collapse:collapse}td{padding:4px;border-bottom:1px solid var(--l)}
@media print{header,.no{display:none!important}body{background:#fff;color:#000}.card{box-shadow:none}}
</style></head><body>

const day=t=>new Date(t).toLocaleDateString('fa-IR-u-ca-persian');
const pk=(t,m)=>new Intl.DateTimeFormat('en-u-ca-persian',{year:'numeric',month:'numeric',day:'numeric'}).formatToParts(t).filter(x=>x.type=='year'||x.type=='month'||(!m&&x.type=='day')).map(x=>x.value).join('/');
const save=()=>{try{localStorage.setItem(K,JSON.stringify(db))}catch(e){}};
function load(){try{db=JSON.parse(localStorage.getItem(K))}catch(e){}
if(!db){db={no:3720,g:DATA.map((r,k)=>({id:'g'+k,n:r[0],cd:String(1001+k),bc:'',co:r[1],pr:Math.round(r[1]*(1+r[3]/100)/1000)*1000,st:r[2],mn:0})),s:[],c:[],i:[],x:[],p:[]};save()}}
const bal=c=>db.i.filter(i=>i.cu==c.id).reduce((a,i)=>a+i.tot-i.pd,0)-db.p.filter(p=>p.cu==c.id).reduce((a,p)=>a+p.a,0);
const gpf=i=>i.l.reduce((a,l)=>a+l.q*(l.pr-l.co),0);
const seg=(k,o)=>`<div class="sgs">${o.map(([v,l])=>`<button class="${st[k]==v?'on':''}" onclick="st.${k}='${v}';render()">${l}</button>`).join('')}</div>`;
const T={home:'',sale:'فروش سریع',items:'کالا و خدمات',inv:'فاکتور فروش',cust:'مشتریان',cu:'مشتری',exp:'هزینه',rep:'گزارشات',set:'تنظیمات',show:'فاکتور'};
const TL=[['sale','🛒','فروش سریع'],['items','📦','کالا و خدمات'],['inv','🧾','فاکتور فروش'],['cust','👥','مشتریان'],['exp','💸','هزینه'],['rep','📊','گزارشات'],['set','⚙️','تنظیمات']];
const V={
home(){const t=Date.now(),ts=db.i.filter(i=>pk(i.t)==pk(t)),lw=db.g.filter(x=>x.mn>0&&x.st<=x.mn),dc=db.c.filter(c=>bal(c)>0);
return `<div class="card row" style="background:none;box-shadow:none"><button class="btn big" onclick="newSale()">🛒 فروش جدید</button><button class="btn big" style="width:74px" onclick="newSale();scan()">📷</button></div>
<div class="g"><div class="card"><small>فروش امروز</small><br><b>${n(ts.reduce((a,i)=>a+i.tot,0))}</b></div><div class="card"><small>سود ناخالص امروز</small><br><b style="color:var(--ok)">${n(ts.reduce((a,i)=>a+gpf(i),0))}</b></div></div>
<div class="g">${TL.map(([k,i,l])=>`<div class="card tile" onclick="go('${k}')">${i}<br>${l}</div>`).join('')}</div>
${lw.length?`<div class="card"><b style="color:var(--w)">⚠ کم‌موجودی (${n(lw.length)})</b>${lw.slice(0,6).map(x=>`<div>${esc(x.n)} — ${n(x.st)}</div>`).join('')}</div>`:''}
${dc.length?`<div class="card" onclick="go('cust')"><b style="color:var(--e)">🔴 ${n(dc.length)} مشتری بدهکار</b><div>جمعاً ${n(dc.reduce((a,c)=>a+bal(c),0))} تومان</div></div>`:''}`},
sale(){const tot=cart.reduce((a,l)=>a+l.q*l.pr,0);
return `<div class="card">${cart.length?cart.map((l,k)=>`<div class="row" style="margin:6px 0"><span style="flex:1">${esc(l.n)}</span><span><button class="q" onclick="qty(${k},1)">+</button> ${n(l.q)} <button class="q" onclick="qty(${k},-1)">−</button></span><b style="min-width:80px;text-align:left" onclick="pe(${k})">${n(l.q*l.pr)}</b></div>`).join(''):'<p class="m">با جستجو یا اسکن، کالا یا خدمت اضافه کنید</p>'}</div>
<div class="card"><div class="row"><select id="sc" onchange="cc=this.value"><option value="">مشتری (اختیاری)</option>${db.c.map(c=>`<option value="${c.id}" ${cc==c.id?'selected':''}>${esc(c.n)}</option>`).join('')}</select><button class="q" style="width:44px;height:44px" onclick="addC()">+</button></div>
<select id="sm"><option value="نقدی">نقدی</option><option value="کارت">کارت</option><option value="کارت‌به‌کارت">کارت‌به‌کارت</option></select>
<input id="sd" inputmode="numeric" placeholder="مبلغ پرداختی (خالی = کامل، کمتر = نسیه)">
<label><input type="checkbox" id="si" checked style="width:auto"> صدور فاکتور</label>
<button class="btn big" style="margin-top:8px" onclick="done()">ثبت فروش — ${n(tot)} تومان</button></div>`},
items(){const k=st.tab,L=db[k];return seg('tab',[['g','کالاها'],['s','خدمات']])+`<button class="btn add" onclick="edit('${k}')">+ تعریف ${k=='g'?'کالا':'خدمت'}</button>`+L.slice(0,120).map(x=>`<div class="card row" onclick="edit('${k}','${x.id}')"><span>${esc(x.n)}<br><small>${k=='g'?'کد '+fd(x.cd)+' · موجودی '+n(x.st):'خدمت'}</small></span><b>${n(x.pr)}</b></div>`).join('')+(L.length>120?'<p class="m" style="text-align:center">برای بقیه از جستجوی بالا استفاده کنید</p>':'')},
inv(){return db.i.filter(i=>i.no).map(i=>{const c=db.c.find(x=>x.id==i.cu);return `<div class="card row" onclick="go('show','${i.id}')"><span>#${fd(i.no)} <small>${day(i.t)}</small><br><small>${c?esc(c.n):'—'}</small></span><b>${n(i.tot)}</b></div>`}).join('')||'<p class="m" style="text-align:center">هنوز فاکتوری صادر نشده</p>'},
show(){const i=db.i.find(x=>x.id==arg),c=db.c.find(x=>x.id==i.cu);
return `<div class="card"><div class="row"><b>ترافیک</b><span>فاکتور ${fd(i.no)}<br><small>${day(i.t)}</small></span></div>${c?`<div>مشتری: ${esc(c.n)}</div>`:''}<table>${i.l.map(l=>`<tr><td>${esc(l.n)}</td><td>${n(l.q)}</td><td>${n(l.pr)}</td><td>${n(l.q*l.pr)}</td></tr>`).join('')}</table><div class="row"><b>جمع کل</b><b>${n(i.tot)}</b></div><div class="row"><span>پرداخت‌شده (${i.m})</span><span>${n(i.pd)}</span></div>${c?`<div class="row"><span>مانده حساب شما</span><b>${n(bal(c))}</b></div>`:''}</div><div class="g no"><button class="btn" onclick="prn('A4')">چاپ A4</button><button class="btn" onclick="prn('A5')">چاپ A5</button></div>`},
cust(){return `<button class="btn add" onclick="addC()">+ مشتری جدید</button>`+db.c.map(c=>`<div class="card row" onclick="go('cu','${c.id}')"><span>${esc(c.n)}<br><small>${esc(c.ph)}</small></span><b style="color:${bal(c)>0?'var(--e)':'var(--ok)'}">${n(bal(c))}</b></div>`).join('')},
cu(){const c=db.c.find(x=>x.id==arg);return `<div class="card"><b>${esc(c.n)}</b> <small>${esc(c.ph)} ${esc(c.cd)}</small><div style="margin:8px 0">مانده حساب: <b style="color:var(--e)">${n(bal(c))}</b> تومان</div><button class="btn" onclick="pay('${c.id}')">ثبت پرداخت</button></div>`+db.i.filter(i=>i.cu==c.id).map(i=>`<div class="card row" ${i.no?`onclick="go('show','${i.id}')"`:''}><span>${day(i.t)} ${i.no?'#'+fd(i.no):''}</span><span>مانده ${n(i.tot-i.pd)}</span></div>`).join('')},
exp(){return `<button class="btn add" onclick="addX()">+ ثبت هزینه</button>`+db.x.map(x=>`<div class="card row"><span>${esc(x.n)}<br><small>${day(x.t)}</small></span><b>${n(x.a)}</b></div>`).join('')},
rep(){const t=Date.now(),f=x=>st.per=='a'||pk(x,st.per=='m')==pk(t,st.per=='m'),L=db.i.filter(i=>f(i.t)).flatMap(i=>i.l).filter(l=>st.sec=='all'||l.k==st.sec),
s=L.reduce((a,l)=>a+l.q*l.pr,0),g=L.reduce((a,l)=>a+l.q*(l.pr-l.co),0),ex=st.sec=='g'?0:db.x.filter(x=>f(x.t)).reduce((a,x)=>a+x.a,0),r=(l,v,c)=>`<div class="card row"><span>${l}</span><b style="color:${c||'inherit'}">${n(v)}</b></div>`;
return seg('per',[['d','امروز'],['m','این ماه'],['a','همه']])+seg('sec',[['all','همه'],['s','کافی‌نت'],['g','لوازم‌التحریر']])+r('فروش',s)+r('سود ناخالص',g,'var(--ok)')+r('هزینه‌ها',ex,'var(--e)')+r('سود خالص',g-ex,'var(--p)')+'<p class="m" style="margin:0 14px">هزینه‌ها (اجاره، قبض و…) فقط به کافی‌نت تعلق می‌گیرند.</p>'},
set(){return `<div class="card"><p>قیمت‌های اکسل شما به‌عنوان «قیمت خرید» وارد شد؛ فروش = خرید + سود (تحریر ۴۰٪، دیجیتال ۵۰٪).</p><button class="btn" onclick="applyP()">تغییر درصد سود همه‌ی کالاها</button></div><div class="card"><p>اگر قیمت‌های اکسل خودِ قیمت فروش بودند:</p><button class="btn" onclick="asSale()">همین قیمت‌ها = قیمت فروش</button></div><div class="card"><button class="btn" style="background:var(--e);color:#fff" onclick="reset()">پاک‌کردن همه‌ی اطلاعات</button></div>`}};
function render(){$('#app').innerHTML=V[view]();$('#ttl').textContent=T[view];$('#back').style.display=view=='home'?'none':'';
const a=db.g.filter(x=>x.mn>0&&x.st<=x.mn).length+db.c.filter(c=>bal(c)>0).length;$('#bell').innerHTML='🔔'+(a?`<i>${n(a)}</i>`:'');scrollTo(0,0)}
function go(v,a){view=v;arg=a;$('#sr').innerHTML='';$('#q').value='';render()}
function newSale(){cart=[];cc='';go('sale');$('#q').focus()}
function add(k,id){const o=db[k].find(x=>x.id==id),l=cart.find(x=>x.id==id);l?l.q++:cart.push({k,id,n:o.n,q:1,pr:o.pr,co:o.co||0});go('sale')}
function qty(k,d){cart[k].q+=d;if(cart[k].q<1)cart.splice(k,1);render()}
function pe(k){const v=prompt('قیمت واحد',cart[k].pr);if(v!==null){cart[k].pr=num(v);render()}}
function srch(v){const r=$('#sr');v=nz(v.trim());if(!v){r.innerHTML='';return}
const m=x=>nz(x.n+' '+(x.cd||'')+' '+(x.bc||'')+' '+(x.ph||'')).includes(v),it=(k,x)=>`<div class="card row" onclick="add('${k}','${x.id}')"><span>${esc(x.n)}<br><small>${k=='g'?'موجودی '+n(x.st):'خدمت'}</small></span><b>${n(x.pr)}</b></div>`;
r.innerHTML=db.g.filter(m).slice(0,8).map(x=>it('g',x)).join('')+db.s.filter(m).slice(0,4).map(x=>it('s',x)).join('')+db.c.filter(m).slice(0,4).map(c=>`<div class="card row" onclick="go('cu','${c.id}')"><span>👤 ${esc(c.n)}</span><b>${n(bal(c))}</b></div>`).join('')||'<p class="m">نتیجه‌ای نیست</p>'}
async function scan(){const C=window.Capacitor;if(C&&C.isNativePlatform&&C.isNativePlatform()){try{const r=await C.registerPlugin('BarcodeScanner').scan(),v=r.barcodes[0]&&r.barcodes[0].rawValue;if(v){const o=db.g.find(x=>x.bc==v);o?add('g',o.id):alert('این بارکد ثبت نشده: '+v)}}catch(e){alert('اسکن ممکن نشد')}return}try{const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}),v=document.createElement('video');v.srcObject=s;v.setAttribute('playsinline','');v.style.cssText='position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:9;background:#000';document.body.append(v);await v.play();const d=new BarcodeDetector(),end=()=>{s.getTracks().forEach(t=>t.stop());v.remove()};v.onclick=end;(async function f(){if(!v.isConnected)return;try{const r=await d.detect(v);if(r.length){end();const o=db.g.find(x=>x.bc==r[0].rawValue);o?add('g',o.id):alert('این بارکد ثبت نشده: '+r[0].rawValue);return}}catch(e){}requestAnimationFrame(f)})()}catch(e){alert('اسکن با دوربین در این مرورگر یا محیط در دسترس نیست')}}
function done(){if(!cart.length)return;const tot=cart.reduce((a,l)=>a+l.q*l.pr,0),v=$('#sd').value,pd=v===''?tot:num(v),c=$('#sc').value;
if(pd<tot&&!c)return alert('برای پرداخت ناقص (نسیه)، مشتری را انتخاب کنید');
const iv=$('#si').checked,r={id:'i'+Date.now(),t:Date.now(),no:iv?db.no++:0,cu:c,l:cart,tot,pd:Math.min(pd,tot),m:$('#sm').value};
cart.forEach(l=>{if(l.k=='g'){const o=db.g.find(x=>x.id==l.id);o&&(o.st-=l.q)}});db.i.unshift(r);save();cart=[];cc='';iv?go('show',r.id):go('home')}
function edit(k,id){const o=id?db[k].find(x=>x.id==id):{id:k+Date.now(),n:'',cd:'',bc:'',co:0,pr:0,st:0,mn:0},a=prompt;let v;
if((v=a('نام',o.n))===null||!v.trim())return;o.n=v.trim();if((v=a('کد',o.cd))===null)return;o.cd=v;
if(k=='g'&&(v=a('بارکد (خالی = ندارد)',o.bc))!==null)o.bc=v.trim();
if((v=a(k=='g'?'قیمت خرید':'هزینه تقریبی هر بار (اختیاری)',o.co))!==null)o.co=num(v);
if((v=a('قیمت فروش',o.pr))!==null)o.pr=num(v);
if(k=='g'){if((v=a('موجودی',o.st))!==null)o.st=num(v);if((v=a('حداقل موجودی برای هشدار',o.mn))!==null)o.mn=num(v)}
if(!id)db[k].unshift(o);save();render()}
function addC(){const nm=prompt('نام مشتری');if(!nm)return;const c={id:'c'+Date.now(),n:nm.trim(),ph:prompt('شماره تماس')||'',cd:(prompt('کد مشتری (حداکثر ۱۰ رقم)')||'').slice(0,10)};db.c.push(c);if(view=='sale')cc=c.id;save();render()}
function pay(id){const a=num(prompt('مبلغ پرداخت (تومان)'));if(!a)return;db.p.push({cu:id,t:Date.now(),a});save();render()}
function addX(){const t=prompt('عنوان هزینه (اجاره، قبض، خرید ملزومات…)');if(!t)return;const a=num(prompt('مبلغ (تومان)'));if(!a)return;db.x.unshift({n:t,a,t:Date.now()});save();render()}
function prn(s){$('#ps').textContent='@page{size:'+s+';margin:10mm}';print()}
function applyP(){const p=prompt('درصد سود روی بهای خرید؟','40');if(p===null)return;db.g.forEach(x=>x.pr=Math.round(x.co*(1+num(p)/100)/1000)*1000);save();alert('انجام شد')}
function asSale(){if(confirm('قیمت‌های فایل به‌عنوان قیمت فروش ثبت شوند؟')){db.g.forEach(x=>{x.pr=x.co;x.co=0});save();alert('انجام شد')}}
function reset(){if(confirm('همه‌ی اطلاعات پاک شود؟')){try{localStorage.removeItem(K)}catch(e){}load();go('home')}}
load();render();
</script></body></html>
