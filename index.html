<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><title>ترافیک</title>
<meta name="color-scheme" content="light dark">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
<style id="ps"></style>
<style>
:root{--bg:#f2f5fa;--c:#fff;--t:#16213a;--m:#6b7690;--p:#0b3d9e;--bt:#fff;--ok:#12805c;--w:#d97706;--e:#c62828;--l:#e3e8f2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1424;--c:#18203a;--t:#e8edf8;--m:#9aa6c4;--p:#6d9bff;--bt:#0e1424;--ok:#38c79a;--w:#f5a524;--e:#ff6b6b;--l:#28324f}}
:root[data-theme=dark]{--bg:#0e1424;--c:#18203a;--t:#e8edf8;--m:#9aa6c4;--p:#6d9bff;--bt:#0e1424;--ok:#38c79a;--w:#f5a524;--e:#ff6b6b;--l:#28324f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font:15px Vazirmatn,Tahoma,sans-serif;padding-bottom:30px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--c);padding:8px 12px;box-shadow:0 1px 4px #0002}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.logo{background:#fff;border-radius:10px;padding:2px 8px;height:38px}
#bell{font-size:22px;position:relative}#bell i{position:absolute;top:-6px;left:-8px;background:var(--e);color:#fff;border-radius:9px;font:700 11px sans-serif;padding:1px 5px}
.card{background:var(--c);border-radius:14px;padding:12px;margin:10px 12px;box-shadow:0 1px 3px #0001}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 12px}.g .card{margin:0}
.tile{text-align:center;font-size:17px;padding:18px 6px}
.btn{border:0;border-radius:12px;padding:12px;background:var(--p);color:var(--bt);font:700 15px inherit;font-family:inherit;width:100%}
.big{padding:16px;font-size:18px}.add{width:calc(100% - 24px);margin:10px 12px}
input,select{width:100%;padding:11px;border:1px solid var(--l);border-radius:10px;background:var(--c);color:var(--t);font:inherit;margin:4px 0}
header input{width:auto;flex:1}header button{border:0;background:var(--l);color:var(--t);border-radius:10px;padding:10px 12px;font-size:16px}
.sgs{display:flex;gap:6px;margin:10px 12px}.sgs button{flex:1;border:1px solid var(--l);background:var(--c);color:var(--t);border-radius:10px;padding:10px;font:inherit}.sgs .on{background:var(--p);color:var(--bt);border-color:var(--p)}
.q{border:0;background:var(--l);color:var(--t);border-radius:8px;width:30px;height:30px;font-size:18px}
.it{user-select:none;-webkit-user-select:none}small,.m{color:var(--m)}#sr{max-height:50vh;overflow:auto}table{width:100%;border-collapse:collapse}td{padding:4px;border-bottom:1px solid var(--l)}
@media print{header,.no{display:none!important}body{background:#fff;color:#000}.card{box-shadow:none}}

:root{--bg:#f4f7fc;--p:#2f6fd0;--l:#e6ebf4}body{padding-bottom:84px}.card{border:1px solid var(--l);border-radius:18px;box-shadow:none}.btn{border-radius:14px}.btn.out{background:var(--c);color:var(--p);border:1px solid var(--p)}
.brand{display:flex;align-items:center;gap:8px}.ib{display:inline-flex;align-items:center;justify-content:center;min-width:38px;height:38px;border-radius:12px;background:var(--bg);border:1px solid var(--l);font-size:15px;padding:0 8px}
.chip{display:inline-block;border:1px solid var(--l);background:var(--c);border-radius:20px;padding:7px 14px;margin:3px;font-size:13px}.chip.on{background:var(--p);color:var(--bt);border-color:var(--p)}.dash{border-style:dashed;color:var(--p)}
.tb{display:flex;gap:8px;margin:10px 12px}.srch{width:calc(100% - 24px);margin:0 12px}.ico{width:42px;height:42px;border-radius:12px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:20px}
.acts{display:flex;gap:5px}.acts i{font-style:normal;width:34px;height:34px;border-radius:10px;border:1px solid var(--l);display:flex;align-items:center;justify-content:center}
.nav{position:fixed;bottom:0;left:0;right:0;z-index:6;display:flex;overflow-x:auto;background:var(--c);border-top:1px solid var(--l);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}.nav a{flex:1 0 56px;text-align:center;font-size:11px;color:var(--m);display:flex;flex-direction:column;gap:2px}.nav i{font-style:normal;font-size:19px}.nav a.on{color:var(--p);font-weight:700}
.md{display:none;position:fixed;inset:0;z-index:8;background:#0007;align-items:flex-end;justify-content:center}.mb{background:var(--c);border-radius:22px 22px 0 0;width:100%;max-width:560px;max-height:90vh;overflow:auto;padding:16px}.fl{display:block;margin:10px 2px 2px;font-size:13px;color:var(--m)}textarea{width:100%;padding:11px;border:1px solid var(--l);border-radius:10px;background:var(--c);color:var(--t);font:inherit}
#cam{position:fixed;left:0;right:0;z-index:4;padding:6px 12px;background:var(--bg)}#camb{display:none;gap:6px;align-items:center;margin-bottom:6px}#camv{height:28vh;border-radius:18px;border:2px dashed var(--p);display:flex;align-items:center;justify-content:center;text-align:center;color:var(--p);font-weight:700}
.md.side{align-items:stretch;justify-content:flex-start}.dw{border-radius:0;max-height:none;width:78%;max-width:320px;height:100%}.mi{padding:14px 6px;border-top:1px solid var(--l);font-size:16px}
#pp{display:none}@media print{body>*:not(#pp){display:none!important}#pp{display:block}#pp img{width:100%;display:block;page-break-after:always}}
#pl .card{content-visibility:auto;contain-intrinsic-size:auto 78px}
</style></head><body>

t3=k=>{const p=[];if(k>=100)p.push(H[Math.floor(k/100)]);k%=100;if(k>=20){p.push(T[Math.floor(k/10)]);if(k%10)p.push(O[k%10])}else if(k)p.push(O[k]);return p.join(' و ')},g=[];

function stE(c){const E=[];db.i.filter(i=>i.cu==c.id).forEach(i=>{const doc=i.no?fd(i.no):'—';i.l.forEach(l=>E.push({t:i.t,doc,desc:l.n+(l.d?' (تخفیف '+fd(l.d)+'٪)':''),q:l.q,pr:l.pr,dr:nl(l),cr:0}));if(i.fr>0)E.push({t:i.t,doc,desc:'کرایه حمل',dr:+i.fr,cr:0});if(i.pd>0)E.push({t:i.t,doc,desc:'پرداخت هنگام فروش ('+(i.m||'نقدی')+')',dr:0,cr:+i.pd})});db.p.filter(p=>p.cu==c.id).forEach(p=>E.push({t:p.t,doc:'—',desc:'پرداخت ('+(p.m||'نقدی')+')'+(p.ds?' · '+p.ds:''),dr:0,cr:+p.a}));return E.sort((a,b)=>a.t-b.t)}

// ---------- تاریخ شمسی (گردش حساب) ----------
function jToG(jy,jm,jd){const jy1=jy-979,jm1=jm-1,jd1=jd-1;let jdn=365*jy1+Math.floor(jy1/33)*8+Math.floor((jy1%33+3)/4);const ml=[31,31,31,31,31,31,30,30,30,30,30,29];for(let i=0;i<jm1;i++)jdn+=ml[i];jdn+=jd1;let gd=jdn+79;let gy=1600+400*Math.floor(gd/146097);gd=gd%146097;let leap=true;if(gd>=36525){gd--;gy+=100*Math.floor(gd/36524);gd=gd%36524;if(gd>=365)gd++;else leap=false}gy+=4*Math.floor(gd/1461);gd=gd%1461;if(gd>=366){leap=false;gd--;gy+=Math.floor(gd/365);gd=gd%365}const gdm=[0,31,leap?29:28,31,30,31,30,31,31,30,31,30,31];let gm=0;gd++;while(gm<12&&gd>gdm[gm+1]){gd-=gdm[gm+1];gm++}return new Date(gy,gm,gd)}
function gToJ(gy,gm,gd){const g=[0,31,59,90,120,151,181,212,243,273,304,334];const gy2=gm>2?gy+1:gy;let days=355666+365*gy+Math.floor((gy2+3)/4)-Math.floor((gy2+99)/100)+Math.floor((gy2+399)/400)+gd+g[gm-1];let jy=-1595+33*Math.floor(days/12053);days%=12053;jy+=4*Math.floor(days/1461);days%=1461;if(days>365){jy+=Math.floor((days-1)/365);days=(days-1)%365}let jm,jd;if(days<186){jm=1+Math.floor(days/31);jd=1+(days%31)}else{jm=7+Math.floor((days-186)/30);jd=1+((days-186)%30)}return[jy,jm,jd]}
function jParse(s){s=String(s||'').replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).trim();const m=s.match(/^(\d{4})\/(\d{1,2})\/(\d{1,2})$/);if(!m)return null;return jToG(+m[1],+m[2],+m[3]).getTime()}
function jStr(t){const d=new Date(t),j=gToJ(d.getFullYear(),d.getMonth()+1,d.getDate());return j[0]+'/'+String(j[1]).padStart(2,'0')+'/'+String(j[2]).padStart(2,'0')}
function jToday(){return jStr(Date.now())}
function stRange(){const f=st.sFrom?jParse(st.sFrom):null,t0=st.sTo?jParse(st.sTo):null;return{from:f,to:t0==null?null:t0+86400000-1}}
function stCalc2(c,from,to){const E=stE(c);let open=0;const list=[];E.forEach(e=>{if(from!=null&&e.t<from){open+=e.dr-e.cr;return}if(to!=null&&e.t>to)return;list.push(e)});let run=open,sd=0,sc=0,k=0;const L=list.map(e=>{run+=e.dr-e.cr;sd+=e.dr;sc+=e.cr;return Object.assign({},e,{k:++k,run})});return{open,end:run,sd,sc,list:L}}
function stDue(c){const inv=db.i.filter(i=>i.cu==c.id).sort((a,b)=>a.t-b.t);let pool=db.p.filter(p=>p.cu==c.id).reduce((a,p)=>a+(+p.a||0),0);const rows=[];inv.forEach(i=>{let rem=Math.max(0,(+i.tot||0)-(+i.pd||0));const pay=Math.min(rem,pool);pool-=pay;rem-=pay;if(rem>0)rows.push({t:i.t,doc:i.no?fd(i.no):'—',desc:(i.l||[]).map(l=>l.n).join('، '),amt:rem})});return rows}
