name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: کپی همه‌ی فایل‌های وب به www
        run: |
          mkdir -p www assets
          cp index.html theme.css mode.js desktop-scan.js desktop-keys.js desktop-sync.js icons.js www/
          cp -r kafenet www/
          cp icon-*.png assets/
          test -f www/kafenet/index.html || { echo 'خطا: پوشه‌ی kafenet در مخزن کامل نیست (kafenet/index.html پیدا نشد)'; exit 1; }
          echo "کافی‌نت یار: $(ls www/kafenet | wc -l) فایل"
          ls -R www
      - run: npm install
      - name: MediaPipe و مدل تشخیص چهره (برای روتوشر، غیرحیاتی)
        continue-on-error: true
        run: |
          mkdir -p www/mediapipe/wasm
          cp node_modules/@mediapipe/tasks-vision/vision_bundle.mjs www/mediapipe/
          cp node_modules/@mediapipe/tasks-vision/wasm/* www/mediapipe/wasm/
          curl -fL -o www/mediapipe/blaze_face_short_range.tflite https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite
          curl -fL -o www/mediapipe/selfie_segmenter.tflite https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_segmenter/float16/latest/selfie_segmenter.tflite || echo "هشدار: مدل بخش‌بندی دانلود نشد؛ زمینه با الگوریتم پشتیبان حذف می‌شود"
          ls -la www/mediapipe
      - run: npx cap add android
      - run: npx capacitor-assets generate --android
        continue-on-error: true
      - name: تنظیمات اندروید (حالت‌های مجاز و سطح SDK)
        run: |
          sed -i 's/minSdkVersion = [0-9]*/minSdkVersion = 24/' android/variables.gradle
          sed -i 's#</manifest>#<uses-permission android:name="android.permission.CAMERA"/></manifest>#' android/app/src/main/AndroidManifest.xml
          node fix-android-cleartext.js
      - name: افزونه‌ی پیامک اندروید
        continue-on-error: true
        run: |
          APPID=$(node -p "require('./capacitor.config.json').appId")
          DIR="android/app/src/main/java/$(echo "$APPID" | tr . /)"
          mkdir -p "$DIR"
          cat > "$DIR/SmsComposerPlugin.java" << 'JAVA'
          package PKG_PLACEHOLDER;

          import android.content.Intent;
          import android.net.Uri;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          // باز کردن برنامه‌ی پیامک گوشی با شماره و متن آماده (بدون نیاز به مجوز SEND_SMS)
          @CapacitorPlugin(name = "SmsComposer")
          public class SmsComposerPlugin extends Plugin {
              @PluginMethod
              public void compose(PluginCall call) {
                  String number = call.getString("number", "");
                  String body = call.getString("body", "");
                  if (number == null || number.trim().isEmpty()) {
                      call.reject("شماره‌ی مشتری خالی است");
                      return;
                  }
                  Intent intent = new Intent(Intent.ACTION_SENDTO, Uri.parse("smsto:" + number.trim()));
                  intent.putExtra("sms_body", body == null ? "" : body);
                  if (intent.resolveActivity(getContext().getPackageManager()) == null) {
                      call.reject("برنامه‌ی پیامک روی این گوشی پیدا نشد");
                      return;
                  }
                  getActivity().startActivity(intent);
                  call.resolve();
              }
          }
          JAVA
          cat > "$DIR/MainActivity.java" << 'JAVA'
          package PKG_PLACEHOLDER;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(SmsComposerPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          JAVA
          sed -i "s/PKG_PLACEHOLDER/$APPID/" "$DIR/SmsComposerPlugin.java" "$DIR/MainActivity.java"
          echo "افزونه‌ی پیامک در $DIR نوشته شد"
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: traffic-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
